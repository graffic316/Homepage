<!DOCTYPE html>
<html>

<head>
  <title>Twitch API Example</title>
</head>

<body>
  <h1>Star Citizen Users</h1>
  <ul id="userList"></ul>

  <script>
    // Function to make the API request and populate the user list
    function fetchUsers() {
      fetch('https://api.twitch.tv/helix/streams?game_id=71375&100&first=100&after=', {
          headers: {
            'Client-ID': 'kfbj83x0pqcx58mhbmwf8ftqitlwyx',
            'Authorization': 'Bearer 6hzca0ur8c5ftfv2phtarlrqf4dqno'
          }
        })
        .then(response => response.json())
        .then(data => {
          const userList = document.getElementById('userList');
          data.data.forEach(user => {
            const listItem = document.createElement('li');
            listItem.textContent = user.user_name;
            userList.appendChild(listItem);
          });
        })
        .catch(error => console.error('Error:', error));
    }
    // Call the fetchUsers function when the page loads
    window.onload = fetchUsers;
  </script>
</body>

</html>
